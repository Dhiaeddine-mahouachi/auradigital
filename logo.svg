<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">AuraDigital logo</title>
  <desc id="desc">Orange rounded-square AuraDigital A mark with a lime accent dot.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3f"/>
      <stop offset="0.55" stop-color="#f2532e"/>
      <stop offset="1" stop-color="#dc3e1f"/>
    </linearGradient>
    <radialGradient id="panelGlow" cx="34%" cy="24%" r="76%">
      <stop offset="0" stop-color="#ff8a66" stop-opacity=".58"/>
      <stop offset=".58" stop-color="#ff6844" stop-opacity=".12"/>
      <stop offset="1" stop-color="#a92d17" stop-opacity=".18"/>
    </radialGradient>
    <radialGradient id="dot" cx="32%" cy="26%" r="72%">
      <stop offset="0" stop-color="#dfff79"/>
      <stop offset=".52" stop-color="#c6f15c"/>
      <stop offset="1" stop-color="#a7d83f"/>
    </radialGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#5f1c10" flood-opacity=".30"/>
    </filter>
    <filter id="markShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#2f100b" flood-opacity=".56"/>
    </filter>
    <filter id="dotShadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#6a7422" flood-opacity=".42"/>
    </filter>
  </defs>
  <g filter="url(#panelShadow)">
    <rect x="5" y="5" width="182" height="182" rx="34" fill="url(#panel)"/>
    <rect x="5" y="5" width="182" height="182" rx="34" fill="url(#panelGlow)"/>
    <rect x="8" y="8" width="176" height="176" rx="31" fill="none" stroke="#ffad92" stroke-opacity=".45" stroke-width="1.8"/>
    <rect x="11" y="11" width="170" height="170" rx="29" fill="none" stroke="#b82f19" stroke-opacity=".34" stroke-width="1"/>
  </g>
  <path d="M34 155 74 51h31l43 104h-28l-9-25H70l-9 25H34Zm47-49h22L92 75l-11 31Z" fill="#0b0b0c" fill-rule="evenodd" stroke="#2a2a2c" stroke-width="2" stroke-linejoin="round" filter="url(#markShadow)"/>
  <path d="M82 104h20L92 77 82 104Z" fill="#722414" opacity=".46"/>
  <g filter="url(#dotShadow)">
    <circle cx="146" cy="45" r="18.5" fill="url(#dot)" stroke="#b3d74a" stroke-width="2"/>
    <ellipse cx="140" cy="37" rx="7.2" ry="4.1" fill="#fff" opacity=".46" transform="rotate(-32 140 37)"/>
  </g>
</svg>
