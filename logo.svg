<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AuraDigital A logo</title>
  <desc id="desc">A glossy orange rounded-square badge with a black A and lime accent dot.</desc>
  <defs>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f5f5f2"/>
      <stop offset="1" stop-color="#bfc2be"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f57a42"/>
      <stop offset="0.5" stop-color="#e85f31"/>
      <stop offset="1" stop-color="#c84925"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#292b29"/>
      <stop offset="0.55" stop-color="#111210"/>
      <stop offset="1" stop-color="#050605"/>
    </linearGradient>
    <radialGradient id="dot" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#eaff83"/>
      <stop offset="0.55" stop-color="#cbea58"/>
      <stop offset="1" stop-color="#9bb83d"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="28" y="24" width="456" height="456" rx="104" fill="url(#outer)"/>
    <rect x="35" y="31" width="442" height="442" rx="98" fill="none" stroke="#ffffff" stroke-opacity=".78" stroke-width="5"/>
    <rect x="68" y="70" width="376" height="368" rx="78" fill="url(#orange)" stroke="#9d351c" stroke-width="4"/>
    <path d="M91 101c44-19 95-25 165-25 69 0 122 8 165 26" fill="none" stroke="url(#shine)" stroke-linecap="round" stroke-width="10" opacity=".48"/>
  </g>

  <g filter="url(#soft)">
    <path fill="url(#black)" stroke="#3a3a37" stroke-width="3" fill-rule="evenodd" d="M149 366 240 151h47l91 215h-63l-20-51h-65l-19 51h-62Zm104-101h31l-15-43-16 43Z"/>
  </g>

  <circle cx="363" cy="146" r="34" fill="#6d7a32" opacity=".62" transform="translate(3 7)"/>
  <circle cx="363" cy="146" r="34" fill="url(#dot)"/>
  <ellipse cx="351" cy="133" rx="12" ry="9" fill="#ffffff" opacity=".42"/>
</svg>
