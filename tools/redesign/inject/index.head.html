<style>
/* Homepage-only seven-day sale banner. Does not modify existing site components. */
#aura-sale-bar{box-sizing:border-box;background:#E1E100;color:#0B0F0C;font-family:Inter,system-ui,sans-serif;position:relative;z-index:100;border-bottom:1px solid rgba(11,15,12,.13)}
#aura-sale-bar *{box-sizing:border-box}
#aura-sale-bar .aura-sale-inner{max-width:1320px;margin:0 auto;min-height:49px;padding:8px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 16px;text-align:center}
#aura-sale-bar .aura-sale-tag{font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid #0B0F0C;border-radius:999px;padding:3px 9px;white-space:nowrap}
#aura-sale-bar .aura-sale-copy{font-size:14px;font-weight:500;line-height:1.3}
#aura-sale-bar .aura-sale-copy strong{font-weight:900;font-size:17px}
#aura-sale-bar .aura-sale-timer{font-size:12px;font-weight:600;white-space:nowrap}
#aura-sale-bar .aura-sale-timer time{display:inline-block;min-width:127px;background:#0B0F0C;color:#E1E100;border-radius:999px;padding:5px 10px;margin-left:5px;text-align:center;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#aura-sale-bar .aura-sale-cta{color:#0B0F0C;font-size:13px;font-weight:800;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
#aura-sale-bar .aura-sale-cta:hover{color:#003D2B}
@media(max-width:640px){
#aura-sale-bar .aura-sale-inner{padding:9px 12px;gap:6px 10px;min-height:0}
#aura-sale-bar .aura-sale-tag{font-size:9px;padding:2px 7px}
#aura-sale-bar .aura-sale-copy{font-size:12px}
#aura-sale-bar .aura-sale-copy strong{font-size:14px}
#aura-sale-bar .aura-sale-timer{font-size:11px}
#aura-sale-bar .aura-sale-timer time{min-width:116px;font-size:11px;padding:4px 8px;margin-left:3px}
#aura-sale-bar .aura-sale-cta{font-size:12px}
}

/* One rotating bar on the homepage: offer <-> Auri roadmap. Hides the header's top strip while the offer runs. */
#aura-sale-bar{display:grid;overflow:hidden}
#aura-sale-bar>.aura-sale-inner{grid-area:1/1;width:100%;animation:auraBarA 12s infinite}
#aura-sale-bar>.aura-sale-alt{animation-name:auraBarB;pointer-events:none}
#aura-sale-bar:hover>.aura-sale-inner{animation-play-state:paused}
@keyframes auraBarA{0%,44%{opacity:1;transform:none;visibility:visible}50%,94%{opacity:0;transform:translateY(-8px);visibility:hidden}100%{opacity:1;transform:none;visibility:visible}}
@keyframes auraBarB{0%,44%{opacity:0;transform:translateY(8px);visibility:hidden;pointer-events:none}50%,94%{opacity:1;transform:none;visibility:visible;pointer-events:auto}100%{opacity:0;visibility:hidden}}
.business-hero-categories{margin-bottom:20px}
body:has(#aura-sale-bar) #app[data-page="Main"]>div>div:first-child>div:first-child{display:none}
@media(prefers-reduced-motion:reduce){#aura-sale-bar>.aura-sale-inner{animation:none}#aura-sale-bar>.aura-sale-alt{display:none}}
</style>

<style>
/* Compact acid-yellow AuraDigital hero; scoped to the homepage only. */

.business-hero-search{margin:18px 0 14px}

.business-hero-search textarea{display:block;width:100%;height:72px;min-height:72px;max-height:130px;box-sizing:border-box;padding:13px 15px;resize:vertical;border:1px solid #E3E4DA;background:#FFFEF7;border-radius:15px;font:400 15px/1.45 Inter,system-ui,sans-serif;color:#161A14}

.business-hero-submit{width:100%;display:flex;align-items:center;justify-content:center;gap:14px;min-height:60px;padding:0 22px;box-sizing:border-box;border-radius:18px;background:#0B0F0C;color:#fff;font:650 18px/1.2 Inter,system-ui,sans-serif;transition:background .2s}

.business-hero-submit:focus-visible{outline:3px solid #A4B000;outline-offset:3px}
.business-hero-hint{max-width:670px;margin:14px auto 0;text-align:center;font-size:13px;line-height:1.5;color:#545C48}

.business-hero-path strong{font-weight:650;color:#353C2D}
@media(max-width:640px){
.business-hero{padding-top:42px!important}
.business-hero::before{top:30px;left:-52%;right:-52%;height:720px;background:radial-gradient(ellipse 47% 40% at 51% 43%,rgba(227,239,27,.31),transparent 87%),radial-gradient(ellipse 51% 46% at 53% 66%,rgba(239,246,103,.31),transparent 92%);filter:blur(19px)}
.business-hero-eyebrow{font-size:11px;gap:7px;padding:5px 11px 5px 5px;line-height:1.4}
.business-hero-eyebrow-tag{padding:5px 9px}
.business-hero .business-hero-title{font-size:clamp(36px,9.5vw,46px);letter-spacing:-.047em;line-height:1.02;margin-top:26px}
.business-hero .business-hero-title span{font-size:1.08em}
.business-hero-detail{font-size:14px;line-height:1.58;margin-top:26px;max-width:460px}
.business-hero-entry{margin-top:29px}
.business-hero-card{border-radius:25px;padding:18px 17px 16px}
.business-hero-categories>span{font-size:14px;margin-bottom:12px}
.business-hero-chiprow{gap:7px}
.business-hero-chiprow button{font-size:12px!important;min-height:36px!important;padding:7px 12px!important}
.business-hero-search{margin:14px 0 12px}
.business-hero-search label{font-size:12px}
.business-hero-search textarea{font-size:14px;height:65px;min-height:65px;padding:11px 12px}
.business-hero-submit{min-height:54px;font-size:16px;border-radius:16px}
.business-hero-hint{margin-top:13px;font-size:12px}
.business-hero-path{font-size:11px}
}
@media(prefers-reduced-motion:reduce){.business-hero-submit,.business-hero-chiprow button{transition:none}}

/* ===== v2: pro & minimal homepage (Wix/Miro reference) ===== */
.business-hero .business-hero-title{letter-spacing:-.04em}
.business-hero-entry{text-align:center;max-width:720px}
.business-hero .business-hero-submit{width:auto;display:inline-flex;min-height:54px;padding:0 30px;border-radius:999px;font-size:17px;gap:10px}
.business-hero-note{margin:14px 0 0;font-size:14px;color:#5B6058}
.business-hero .business-hero-categories{text-align:center;margin:34px 0 0}
.business-hero .business-hero-categories>span{font-size:13px;font-weight:600;color:#5B6058;margin-bottom:10px}
.business-hero .business-hero-chiprow{justify-content:center;gap:8px}
.business-hero .business-hero-path{margin:14px 0 0;font-size:13px;color:#5B6058}
.v2-hero-shot{max-width:1180px;margin:64px auto 0;position:relative;perspective:1600px;max-height:560px}
.business-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:160px;background:linear-gradient(to bottom,rgba(255,255,255,0),#FFFFFF 85%);pointer-events:none;z-index:2}
.v2-hero-shot>.v2-frame{transform:rotateX(7deg);transform-origin:50% 0;animation:v2Rise 1.1s cubic-bezier(.2,.7,.2,1) both;box-shadow:0 70px 120px -60px rgba(11,15,12,.55)}
@keyframes v2Rise{from{opacity:0;transform:rotateX(16deg) translateY(40px)}to{opacity:1;transform:rotateX(7deg)}}
.v2-frame{display:block;background:#FFFFFF;border:1px solid #E4E2DA;border-radius:18px;overflow:hidden}
.v2-frame img{display:block;width:100%;height:auto}
.v2-frame-bar{display:flex;align-items:center;gap:6px;padding:11px 14px;border-bottom:1px solid #ECEAE2;background:#FFFFFF}
.v2-frame-bar>span{width:9px;height:9px;border-radius:50%;background:#DAD8CF}
.v2-frame-bar>em{font-style:normal;margin-left:10px;font-size:12px;color:#6B706A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2-frame-dark{background:#07140E;border-color:#1E3328}
.v2-frame-dark .v2-frame-bar{background:#0B1C14;border-color:#1E3328}
.v2-frame-dark .v2-frame-bar>span{background:#2A4235}
.v2-frame-dark .v2-frame-bar>em{color:#9FB5A8}
.v2-float{position:absolute;display:flex;gap:12px;align-items:center;background:#FFFFFF;border:1px solid #E6E4DC;border-radius:18px;padding:14px 16px;box-shadow:0 30px 60px -30px rgba(11,15,12,.45);font-size:13px;color:#4B5650;animation:v2Pop .6s 1s both}
.v2-float strong{display:block;font-size:15px;color:#0B0F0C}
.v2-float-left{left:-28px;bottom:190px}
.v2-float-right{right:-24px;top:90px;animation-delay:1.6s}
@keyframes v2Pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.v2-auri-dot{width:42px;height:42px;border-radius:50%;background:#E1E100;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.v2-check{width:30px;height:30px;border-radius:50%;background:#0E2B1E;color:#E1E100;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.v2-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:44px;border-top:1px solid #E6E4DC}
.v2-step{display:flex;flex-direction:column;gap:8px;padding:28px 28px 8px 0;font-size:15px;color:#4B5650}
.v2-step strong{font-family:'Inter Tight',Inter,sans-serif;font-size:20px;line-height:1.2;color:#0B0F0C}
.v2-step-icon{width:46px;height:46px;border-radius:14px;background:#0E2B1E;color:#E1E100;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.v2-step-tag{font-size:12px;font-weight:600;color:#7A7F78}
.v2-work{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;border:1px solid #E4E2DA;background:#FFFFFF}
.v2-work img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.v2-trust{max-width:1264px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;border-top:1px solid #E6E4DC;border-bottom:1px solid #E6E4DC;padding:26px 0}
.v2-trust-item{display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:600;color:#0B0F0C;text-align:left}
.v2-trust-item svg{color:#0E2B1E;flex:0 0 auto}
@media(max-width:900px){.v2-steps{grid-template-columns:repeat(2,minmax(0,1fr))}.v2-trust{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.v2-trust-item{justify-content:flex-start}}
@media(max-width:560px){.v2-steps{grid-template-columns:minmax(0,1fr)}.v2-step{padding-right:0}.v2-hero-shot{margin-top:44px}.v2-hero-shot>.v2-frame{transform:none;animation:none}.v2-trust{grid-template-columns:minmax(0,1fr)}}
/* Calm top bar: static end date instead of ticking seconds */
#aura-sale-bar .aura-sale-timer time[data-static]{min-width:0;background:transparent;color:#0B0F0C;padding:0;margin-left:3px;font-weight:800}
/* Auri greeting waits until the visitor scrolls */
html:not(.v2-teaser-ok) #app[data-page="Main"]~* button.pop.hide-sm,html:not(.v2-teaser-ok) #app[data-page="Main"] button.pop.hide-sm{display:none!important}
@media(prefers-reduced-motion:reduce){.v2-hero-shot>.v2-frame,.v2-float{animation:none}}
</style>
