<style>
/* Homepage-only seven-day sale banner. Does not modify existing site components. */
#aura-sale-bar{box-sizing:border-box;background:#E1E100;color:#0B0F0C;font-family:Inter,system-ui,sans-serif;position:relative;z-index:100;border-bottom:1px solid rgba(11,15,12,.13)}
#aura-sale-bar *{box-sizing:border-box}
#aura-sale-bar .aura-sale-inner{max-width:1320px;margin:0 auto;min-height:49px;padding:8px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 16px;text-align:center}
#aura-sale-bar .aura-sale-tag{font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid #0B0F0C;border-radius:999px;padding:3px 9px;white-space:nowrap}
#aura-sale-bar .aura-sale-copy{font-size:14px;font-weight:500;line-height:1.3}
#aura-sale-bar .aura-sale-copy strong{font-weight:900;font-size:17px}
#aura-sale-bar .aura-sale-timer{font-size:12px;font-weight:600;white-space:nowrap}
#aura-sale-bar .aura-sale-timer time{display:inline-block;min-width:127px;background:#0B0F0C;color:#E1E100;border-radius:999px;padding:5px 10px;margin-left:5px;text-align:center;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#aura-sale-bar .aura-sale-cta{color:#0B0F0C;font-size:13px;font-weight:800;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
#aura-sale-bar .aura-sale-cta:hover{color:#003D2B}
@media(max-width:640px){
#aura-sale-bar .aura-sale-inner{padding:9px 12px;gap:6px 10px;min-height:0}
#aura-sale-bar .aura-sale-tag{font-size:9px;padding:2px 7px}
#aura-sale-bar .aura-sale-copy{font-size:12px}
#aura-sale-bar .aura-sale-copy strong{font-size:14px}
#aura-sale-bar .aura-sale-timer{font-size:11px}
#aura-sale-bar .aura-sale-timer time{min-width:116px;font-size:11px;padding:4px 8px;margin-left:3px}
#aura-sale-bar .aura-sale-cta{font-size:12px}
}
</style>

<style>
/* Screenshot-inspired entry hero; deliberately scoped to the homepage. */
.business-hero{position:relative;isolation:isolate;overflow:hidden}
.business-hero::before{content:"";position:absolute;z-index:-1;inset:115px -8% auto;height:760px;pointer-events:none;background:radial-gradient(ellipse 51% 36% at 50% 43%,rgba(135,142,255,.30),transparent 85%),radial-gradient(ellipse 63% 45% at 45% 67%,rgba(247,211,255,.39),transparent 90%);filter:blur(22px)}
.business-hero-head{max-width:1100px;margin:0 auto;text-align:center}
.business-hero-eyebrow{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid #ECECF8;background:rgba(255,255,255,.75);border-radius:999px;padding:6px 15px 6px 6px;font-size:13px;color:#47475E;max-width:100%;box-sizing:border-box}
.business-hero-eyebrow-tag{background:#E6E9FF;color:#3842C9;border-radius:999px;padding:4px 11px;font-weight:700;white-space:nowrap}
.business-hero .business-hero-title{margin:36px auto 0;font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:clamp(44px,5.25vw,82px);letter-spacing:-.058em;line-height:1.09;color:#101017}
.business-hero .business-hero-title span{font:inherit;letter-spacing:inherit}
.business-hero-entry{max-width:1060px;margin:46px auto 0;position:relative}
.business-hero-search{display:flex;align-items:center;gap:6px;box-sizing:border-box;padding:7px;background:#fff;border:1px solid rgba(255,255,255,.9);border-radius:999px;box-shadow:0 24px 74px rgba(80,89,208,.11),0 0 0 1px rgba(220,220,245,.23)}
.business-hero-visually-hidden{position:absolute;clip-path:inset(50%);width:1px;height:1px;white-space:nowrap;overflow:hidden}
.business-hero-search textarea{flex:1;min-width:0;height:62px;max-height:130px;box-sizing:border-box;padding:18px 25px;margin:0;resize:none;border:0;background:transparent;box-shadow:none;outline:none;font:400 21px/1.35 Inter,system-ui,sans-serif;color:#161622;scrollbar-width:thin}
.business-hero-search textarea::placeholder{color:#55566A;opacity:1}
.business-hero-search:focus-within{outline:2px solid #444CD5;outline-offset:3px}
.business-hero-search textarea:focus{outline:0!important}
.business-hero-submit{flex:0 0 auto;display:inline-flex;justify-content:center;align-items:center;gap:20px;min-height:69px;padding:0 32px;box-sizing:border-box;border-radius:999px;background:#424BD5;color:#fff;font:500 19px/1.2 Inter,system-ui,sans-serif;white-space:nowrap;transition:background .2s,transform .2s}
.business-hero-submit:hover{background:#303BBE;color:#fff;transform:translateY(-1px)}
.business-hero-submit:focus-visible{outline:3px solid #252DA7;outline-offset:3px}
.business-hero-hint{max-width:690px;margin:24px auto 0;text-align:center;font-size:15px;line-height:1.65;color:#343443}
.business-hero-categories{margin:34px auto 0;text-align:center}
.business-hero-categories>span{display:block;margin-bottom:14px;font-size:14px;font-weight:600;color:#55556B}
.business-hero-chiprow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.business-hero-chiprow button{transition:background .2s,border-color .2s,transform .2s}
.business-hero-chiprow button:hover{transform:translateY(-1px);border-color:#8892E9!important}
.business-hero-chiprow button:focus-visible{outline:2px solid #424BD5;outline-offset:3px}
.business-hero-detail{max-width:720px;margin:38px auto 0;text-align:center;font:400 16px/1.65 Inter,system-ui,sans-serif;color:#505169}
.business-hero-path{max-width:820px;margin:13px auto 0;text-align:center;font-size:13px;line-height:1.65;color:#606178}
.business-hero-path strong{font-weight:600;color:#33344B}
@media(max-width:640px){
.business-hero{padding-top:64px!important}
.business-hero::before{top:100px;left:-35%;right:-35%;height:680px}
.business-hero-eyebrow{font-size:11px;gap:7px;padding-right:10px;line-height:1.5}
.business-hero-eyebrow-tag{padding:5px 9px}
.business-hero .business-hero-title{font-size:clamp(40px,10.5vw,56px);letter-spacing:-.06em;line-height:1.08;margin-top:30px}
.business-hero-entry{margin-top:36px}
.business-hero-search{flex-direction:column;align-items:stretch;gap:8px;border-radius:28px;padding:8px}
.business-hero-search textarea{width:100%;flex:none;height:68px;font-size:16px;line-height:1.5;padding:19px 17px}
.business-hero-submit{width:100%;min-height:56px;padding:0 18px;font-size:17px;gap:14px}
.business-hero-hint{margin-top:16px;font-size:13px}
.business-hero-categories{margin-top:27px}
.business-hero-chiprow{gap:8px}
.business-hero-chiprow button{font-size:13px!important;min-height:38px!important;padding:9px 12px!important}
.business-hero-detail{margin-top:30px;font-size:14px}
.business-hero-path{font-size:12px}
}
@media(prefers-reduced-motion:reduce){.business-hero-submit,.business-hero-chiprow button{transition:none}}
</style>
