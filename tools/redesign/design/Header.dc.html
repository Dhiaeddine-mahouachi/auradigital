<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AuraDigital — Site header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<!--FONTS-->
<style>body{margin:0}</style>
</helmet>
<header class="{{ topCls }}" onMouseLeave="{{ closeAll }}">
  <div class="wrap top-in">
    <a class="logo" href="Main.dc.html" aria-label="AuraDigital home"><i><img src="/_blob/15ec3fa6439e3bb5e1bdb565a3cf95f0" alt="" width="22" height="11"></i>AuraDigital</a>
    <nav class="nav desk" aria-label="Main">
      <button type="button" class="{{ cls.sol }}" onMouseEnter="{{ openSol }}" onClick="{{ openSol }}" aria-expanded="{{ isSol }}">Solutions <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <button type="button" class="{{ cls.prod }}" onMouseEnter="{{ openProd }}" onClick="{{ openProd }}" aria-expanded="{{ isProd }}">Products <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <a class="{{ cls.packages }}" href="Packages.dc.html" onMouseEnter="{{ closeAll }}">Pricing</a>
      <a class="{{ cls.work }}" href="Work.dc.html" onMouseEnter="{{ closeAll }}">Our work</a>
    </nav>
    <div class="top-end">
      <span class="desk lang-switch" role="group" aria-label="Language"><button type="button" class="lang-btn" data-set-lang="en" lang="en" aria-label="English">EN</button><button type="button" class="lang-btn" data-set-lang="tr" lang="tr" aria-label="Türkçe">TR</button><button type="button" class="lang-btn" data-set-lang="ar" lang="ar" aria-label="العربية">AR</button></span>
      <a class="btn btn-ghost btn-sm desk" href="HubApp.dc.html">Log in</a>
      <a class="btn btn-main btn-sm desk" href="Hub.dc.html">Start your path</a>
      <button type="button" class="burger mob" onClick="{{ toggleDrawer }}" aria-label="{{ drawerLabel }}" aria-expanded="{{ drawer }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="{{ burger }}"></path></svg></button>
    </div>
  </div>

  <sc-if value="{{ isSol }}" hint-placeholder-val="{{ false }}">
    <div class="mega desk">
      <div class="wrap mega-in">
        <sc-for list="{{ mega }}" as="col" hint-placeholder-count="4">
          <div class="mega-col">
            <span>{{ col.title }}</span>
            <sc-for list="{{ col.items }}" as="it" hint-placeholder-count="3">
              <a class="mi" href="{{ col.href }}"><b>{{ it.n }}</b><small>{{ it.d }}</small></a>
            </sc-for>
          </div>
        </sc-for>
        <a class="mega-cta" href="Hub.dc.html"><span class="muted">Not sure where to start?</span><b>Let Auri plan your path. It’s free.</b><span class="btn btn-main btn-sm" style="align-self: flex-start">Start your path</span></a>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isProd }}" hint-placeholder-val="{{ false }}">
    <div class="mega desk">
      <div class="wrap mega-in" style="grid-template-columns: repeat(4, minmax(0, 1fr))">
        <sc-for list="{{ products }}" as="p" hint-placeholder-count="4">
          <a class="mprod" href="{{ p.href }}"><span class="tag" style="align-self: flex-start">{{ p.tag }}</span><b>{{ p.n }}</b><small>{{ p.d }}</small></a>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ drawer }}" hint-placeholder-val="{{ false }}">
    <nav class="mnav mob" aria-label="Mobile">
      <sc-for list="{{ mobileLinks }}" as="m" hint-placeholder-count="8">
        <a class="ml" href="{{ m.href }}">{{ m.n }}<span aria-hidden="true" class="muted">›</span></a>
      </sc-for>
      <div class="mbtns"><a class="btn btn-ghost" href="HubApp.dc.html">Log in</a><a class="btn btn-main" href="Hub.dc.html">Start your path</a></div>
      <a class="btn btn-ghost" href="https://wa.me/905385507674" style="margin-top: 10px">WhatsApp us</a>
      <div class="lang-switch" role="group" aria-label="Language"><button type="button" class="lang-btn lang-btn-lg" data-set-lang="en" lang="en" aria-label="English">EN</button><button type="button" class="lang-btn lang-btn-lg" data-set-lang="tr" lang="tr" aria-label="Türkçe">TR</button><button type="button" class="lang-btn lang-btn-lg" data-set-lang="ar" lang="ar" aria-label="العربية">AR</button></div>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","solutions","products","shop","packages","work","help","about","contact","hub"],"default":"home"},"$preview":{"width":1440,"height":120}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: null, drawer: false }; }
  componentDidMount() {
    this.onKey = (e) => { if (e.key === 'Escape') this.setState({ open: null, drawer: false }); };
    try { window.addEventListener('keydown', this.onKey); } catch (e) {}
  }
  componentWillUnmount() { try { window.removeEventListener('keydown', this.onKey); } catch (e) {} }
  renderVals() {
    const s = this.state;
    const a = this.props.active ?? 'home';
    const c = (k) => 'nl' + (a === k ? ' on' : '');
    return {
      topCls: 'top' + (s.drawer ? ' open' : ''),
      isSol: s.open === 'sol', isProd: s.open === 'prod', drawer: s.drawer,
      openSol: () => this.setState({ open: 'sol' }),
      openProd: () => this.setState({ open: 'prod' }),
      closeAll: () => this.setState({ open: null }),
      toggleDrawer: () => { const d = !s.drawer; this.setState({ drawer: d }); try { document.body.style.overflow = d ? 'hidden' : ''; } catch (e) {} },
      drawerLabel: s.drawer ? 'Close menu' : 'Open menu',
      burger: s.drawer ? 'M6 6l12 12M18 6L6 18' : 'M4 7h16M4 12h16M4 17h16',
      cls: { sol: c('solutions'), prod: c('products'), packages: c('packages'), work: c('work') },
      mega: [
        { title: 'Build', href: 'Solutions.dc.html', items: [{ n: 'Websites', d: 'Fast, mobile-first, yours' }, { n: 'Online stores', d: 'Sell products online' }, { n: 'Brand & creative', d: 'Logo, visuals, video' }] },
        { title: 'Get found', href: 'Solutions.dc.html', items: [{ n: 'Google Maps & SEO', d: 'Show up nearby' }, { n: 'Ads', d: 'Google & Meta campaigns' }, { n: 'NFC review cards', d: 'More Google reviews' }] },
        { title: 'Automate', href: 'Solutions.dc.html', items: [{ n: 'WhatsApp AI', d: 'Instant replies & bookings' }, { n: 'AI sales agent', d: 'Qualify leads day and night' }, { n: 'Business email', d: 'you@yourbrand.com' }] },
        { title: 'Manage', href: 'Solutions.dc.html', items: [{ n: 'AuraHub', d: 'Your business dashboard' }, { n: 'Hosting & security', d: 'Always online, protected' }, { n: 'Help Center', d: 'Guides and answers' }] }
      ],
      products: [
        { n: 'AuraMenu', tag: 'Restaurants', d: 'QR menus in Turkish, English and Arabic.', href: 'AuraMenu.dc.html' },
        { n: 'NFC cards', tag: 'Shop', d: 'Review, business and menu cards. Order online.', href: 'Shop.dc.html?tab=cards' },
        { n: 'AuraWeddings', tag: 'Couples', d: 'Digital invitations with RSVP and countdown.', href: 'https://auradigitalworks.com/aura-weddings' },
        { n: 'AuraPops', tag: 'Creators', d: 'One link for profile, links, menu and QR.', href: 'https://aurapops.online' }
      ],
      mobileLinks: [
        { n: 'Solutions', href: 'Solutions.dc.html' }, { n: 'Service shop', href: 'Shop.dc.html' }, { n: 'AuraMenu', href: 'AuraMenu.dc.html' },
        { n: 'Pricing', href: 'Packages.dc.html' }, { n: 'Our work', href: 'Work.dc.html' }, { n: 'Help Center', href: 'Help.dc.html' },
        { n: 'About', href: 'About.dc.html' }, { n: 'Contact', href: 'Contact.dc.html' }
      ]
    };
  }
}
</script>
</body>
</html>
