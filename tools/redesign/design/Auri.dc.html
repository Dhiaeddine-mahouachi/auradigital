<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auri — AuraDigital assistant</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<!--FONTS-->
<style>body{margin:0}</style>
</helmet>
<div class="auri-wrap {{ chatOpenClass }}" style="position: fixed; right: 22px; bottom: 22px; z-index: 80; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; font-family: Inter, system-ui, sans-serif; color: #0B0F0C">
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div class="pop auri-panel" role="dialog" aria-label="Chat with Auri" style="width: 380px; max-width: calc(100vw - 44px); height: 590px; max-height: calc(100vh - 120px); background: #FFFFFF; border: 1px solid #E6E4DC; border-radius: 26px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 40px 90px -30px rgba(11,15,12,.45)">
      <div style="background: #0E2B1E; color: #F3EEDC; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
        <span style="width: 42px; height: 42px; border-radius: 50%; background: #E1E100; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
          <img src="/media/auri/studio-v1/avatar.webp" width="35" height="25" alt="" style="object-fit:contain">
        </span>
        <div style="flex: 1">
          <div style="font-weight: 700">Auri</div>
          <div style="font-size: 12px; color: #A8D8B4">{{ statusText }}</div>
          <a href="/auri-preview/index.html" style="color:#E1E100;font-size:12px;text-decoration:underline">{{ studioLabel }}</a>
        </div>
        <button onClick="{{ reset }}" aria-label="Restart conversation" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(243,238,220,.25); background: transparent; color: #F3EEDC; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></button>
        <button onClick="{{ toggle }}" aria-label="Close chat" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(243,238,220,.25); background: transparent; color: #F3EEDC; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>

      <div ref="{{ boxRef }}" aria-live="polite" style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #FAF9F5">
        <sc-for list="{{ msgs }}" as="m" hint-placeholder-count="2">
          <div dir="{{ m.dir }}" class="pop" style="{{ m.style }}">
            <span style="white-space: pre-line">{{ m.text }}</span>
            <sc-if value="{{ m.hasLinks }}" hint-placeholder-val="{{ false }}">
              <span style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px">
                <sc-for list="{{ m.links }}" as="l" hint-placeholder-count="2">
                  <a href="{{ l.href }}" style="background: #0B0F0C; color: #FFFFFF; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 999px">{{ l.label }} →</a>
                </sc-for>
              </span>
            </sc-if>
          </div>
        </sc-for>
        <sc-if value="{{ typing }}" hint-placeholder-val="{{ false }}">
          <div style="align-self: flex-start; background: #FFFFFF; border: 1px solid #E6E4DC; border-radius: 16px 16px 16px 4px; padding: 12px 16px; display: flex; gap: 5px">
            <span class="dot" style="width: 7px; height: 7px; border-radius: 50%; background: #0E2B1E"></span>
            <span class="dot" style="width: 7px; height: 7px; border-radius: 50%; background: #0E2B1E; animation-delay: .2s"></span>
            <span class="dot" style="width: 7px; height: 7px; border-radius: 50%; background: #0E2B1E; animation-delay: .4s"></span>
          </div>
        </sc-if>
      </div>

      <div style="padding: 10px 12px 0; display: flex; gap: 6px; overflow-x: auto; background: #FFFFFF">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
          <button onClick="{{ c.send }}" style="flex: 0 0 auto; border: 1px solid #D9D6CB; background: #FFFFFF; color: #0B0F0C; border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: Inter, sans-serif; min-height: 36px">{{ c.label }}</button>
        </sc-for>
      </div>
      <form onSubmit="{{ submit }}" style="display: flex; gap: 8px; padding: 10px 12px 12px; background: #FFFFFF">
        <label for="auri-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap">Message Auri</label>
        <input id="auri-input" value="{{ draft }}" onChange="{{ onDraft }}" maxlength="2000" placeholder="Ask Auri anything…" autocomplete="off" style="flex: 1; min-width: 0; border: 1px solid #D9D6CB; background: #FAF9F5; border-radius: 14px; padding: 12px 14px; font-size: 15px; font-family: Inter, sans-serif; color: #0B0F0C">
        <button type="submit" aria-label="Send message" style="width: 46px; height: 46px; border-radius: 14px; border: 0; background: #0B0F0C; color: #E1E100; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
      </form>
      <div style="font-size: 11px; color: #5C665F; text-align: center; padding: 0 12px 10px; background: #FFFFFF">Auri is an AI assistant · prices are confirmed in your proposal</div>
    </div>
  </sc-if>

  <sc-if value="{{ showTeaser }}" hint-placeholder-val="{{ true }}">
    <button onClick="{{ toggle }}" class="pop hide-sm" style="background: #FFFFFF; border: 1px solid #E6E4DC; border-radius: 18px 18px 4px 18px; padding: 12px 16px; font-size: 14px; font-weight: 500; color: #0B0F0C; cursor: pointer; box-shadow: 0 20px 40px -20px rgba(11,15,12,.4); font-family: Inter, sans-serif; max-width: 240px; text-align: left">Hi! I'm Auri. Need help choosing?</button>
  </sc-if>
  <button ref="{{ fabRef }}" onClick="{{ toggle }}" aria-label="{{ fabLabel }}" class="auri-float auri-fab" style="position: relative; width: 70px; height: 70px; border-radius: 50%; border: 0; background: #06140F; outline: 1px solid #10B981; cursor: pointer; box-shadow: 0 18px 40px -12px rgba(11,15,12,.55); display: flex; align-items: center; justify-content: center">
    <img class="auri-official-avatar" src="/media/auri/studio-v1/avatar.webp" width="64" height="68" alt="" style="width:64px;height:68px;max-width:95%;max-height:95%;object-fit:contain;display:block;filter:drop-shadow(0 0 7px rgba(16,185,129,.4))">
    <sc-if value="{{ unread }}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: 0; right: 0; width: 20px; height: 20px; border-radius: 50%; background: #D93025; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF">1</span></sc-if>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startOpen":{"editor":"boolean","default":false},"$preview":{"width":440,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: !!props.startOpen, seen: !!props.startOpen, typing: false, draft: '', lang: 'en', msgs: [this.greet('en')] };
  }
  apiAvailable() {
    try { return !!(window.AURA_LIVE_API || /(^|\.)auradigitalworks\.com$/.test(location.hostname)); } catch (e) { return false; }
  }
  componentDidMount() {
    this.teaserTimer = setTimeout(() => this.setState({ teaserGone: true }), 9000);
    // Follow the site language switcher (redesign/i18n.js).
    this.onLang = () => {
      const l = this.pageLang();
      const fresh = this.state.msgs.length === 1 && this.state.msgs[0].role === 'bot';
      this.setState(fresh ? { lang: l, msgs: [this.greet(l)] } : { lang: l });
    };
    try { window.addEventListener('aura:lang', this.onLang); } catch (e) {}
    if (this.pageLang() !== 'en') this.onLang();
  }
  pageLang() {
    try { const l = document.documentElement.lang; return l === 'tr' || l === 'ar' ? l : 'en'; } catch (e) { return 'en'; }
  }
  componentWillUnmount() {
    try { window.removeEventListener('aura:lang', this.onLang); } catch (e) {}
    clearTimeout(this.timer); clearTimeout(this.teaserTimer);
  }
  greet(l) {
    const t = {
      en: "Hi! I'm Auri, AuraDigital's AI assistant. I can suggest services, explain prices, or connect you with our team. What does your business do?",
      tr: "Merhaba! Ben Auri, AuraDigital'in yapay zekâ asistanıyım. Hizmet önerebilir, fiyatları açıklayabilir veya sizi ekibimize bağlayabilirim. İşletmeniz ne yapıyor?",
      ar: "مرحباً! أنا أوري، مساعد AuraDigital الذكي. أستطيع اقتراح الخدمات وشرح الأسعار أو توصيلك بفريقنا. ما هو نشاطك التجاري؟"
    };
    return { role: 'bot', text: t[l], links: [{ label: l === 'tr' ? 'Yol haritamı oluştur' : l === 'ar' ? 'ابنِ خطتي' : 'Build my roadmap', href: 'Hub.dc.html' }] };
  }
  detect(s) {
    if (/[؀-ۿ]/.test(s)) return 'ar';
    if (/[çğıöşüİ]/i.test(s) || /\b(merhaba|selam|fiyat|ne kadar|nasıl|istiyorum|var mı|web sitesi|menü|kaç)\b/i.test(s)) return 'tr';
    if (/\b(hi|hello|hey|how|what|price|website|menu|need|want|can|the)\b/i.test(s)) return 'en';
    return this.pageLang();
  }
  brain(q, l) {
    const s = q.toLowerCase();
    const has = (arr) => arr.some((k) => s.indexOf(k) !== -1);
    const R = (en, tr, ar, links) => ({ text: { en, tr, ar }[l], links: links || [] });
    const L = (en, tr, ar, href) => ({ label: { en, tr, ar }[l], href });
    const contactLink = L('Contact us', 'Bize ulaşın', 'تواصل معنا', 'Contact.dc.html');
    if (has(['price', 'cost', 'how much', 'fiyat', 'ücret', 'ne kadar', 'kaç para', 'سعر', 'كم', 'تكلفة', 'الأسعار']))
      return R("Website packages (one-time, TRY):\n• Launch — ₺6,750 (up to 3 pages)\n• Growth — ₺13,400 (4–10 pages, premium design)\n• System — ₺22,400 (dashboard, logins)\nCare plans from ₺1,950/month · AuraMenu from ₺1,599 · NFC card ₺700. Taxes and scope are confirmed in your proposal.",
        "Web sitesi paketleri (tek seferlik, TL):\n• Launch — ₺6.750 (3 sayfaya kadar)\n• Growth — ₺13.400 (4–10 sayfa, premium tasarım)\n• System — ₺22.400 (panel, kullanıcı girişi)\nBakım planları aylık ₺1.950'den · AuraMenu ₺1.599'dan · NFC kart ₺700. Vergi ve kapsam teklifte netleşir.",
        "باقات المواقع (دفعة واحدة، ليرة تركية):\n• Launch — ₺6,750 (حتى 3 صفحات)\n• Growth — ₺13,400 (4–10 صفحات، تصميم مميز)\n• System — ₺22,400 (لوحة تحكم وتسجيل دخول)\nخطط الصيانة من ₺1,950 شهرياً · AuraMenu من ₺1,599 · بطاقة NFC ₺700. الضرائب والنطاق تُؤكد في العرض.",
        [L('See packages', 'Paketleri gör', 'عرض الباقات', 'Packages.dc.html'), L('Service Shop', 'Hizmet Mağazası', 'متجر الخدمات', 'Shop.dc.html')]);
    if (has(['menu', 'restaurant', 'cafe', 'café', 'qr', 'menü', 'restoran', 'kafe', 'مطعم', 'قائمة', 'منيو', 'مقهى']))
      return R("For restaurants and cafés: AuraMenu, a QR digital menu in Turkish, English and Arabic. Self-service ₺1,599 or done-for-you ₺2,500 (one-time). Next steps: a website and WhatsApp orders.",
        "Restoran ve kafeler için AuraMenu: Türkçe, İngilizce ve Arapça QR dijital menü. Kendin yap ₺1.599, biz yapalım ₺2.500 (tek seferlik). Sonra web sitesi ve WhatsApp siparişleri.",
        "للمطاعم والمقاهي: AuraMenu، قائمة رقمية بكود QR بالتركية والإنجليزية والعربية. خدمة ذاتية ₺1,599 أو ننفذها لك بـ ₺2,500 (دفعة واحدة).",
        [L('Explore AuraMenu', "AuraMenu'yü incele", 'اكتشف AuraMenu', 'AuraMenu.dc.html'), L('auramenu.space', 'auramenu.space', 'auramenu.space', 'https://auramenu.space')]);
    if (has(['whatsapp', 'bot', 'automat', 'otomasyon', 'otomatik', 'واتساب', 'أتمتة', 'رد آلي']))
      return R("We build scoped WhatsApp automation: instant replies, prices and hours, bookings and lead capture, through the official WhatsApp Cloud API. The scope is agreed with you first.",
        "Kapsamı belirlenmiş WhatsApp otomasyonu kuruyoruz: anında yanıt, fiyat ve saatler, randevu ve müşteri toplama — resmi WhatsApp Cloud API ile. Kapsam önce sizinle netleşir.",
        "نبني أتمتة واتساب محددة النطاق: ردود فورية، أسعار ومواعيد، حجوزات وجمع العملاء — عبر WhatsApp Cloud API الرسمي. يتم الاتفاق على النطاق معك أولاً.",
        [L('Automation', 'Otomasyon', 'الأتمتة', 'Solutions.dc.html'), contactLink]);
    if (has(['google', 'maps', 'seo', 'review', 'ads', 'reklam', 'yorum', 'harita', 'خرائط', 'إعلان', 'تقييم']))
      return R("To get more customers: an SEO-ready website, a complete Google Maps profile and ads. Ads setup ₺2,500, management from ₺3,500/month. NFC review cards (₺700) help collect Google reviews.",
        "Daha fazla müşteri için: SEO uyumlu site, eksiksiz Google Haritalar profili ve reklamlar. Reklam kurulumu ₺2.500, yönetim aylık ₺3.500'den. NFC yorum kartları (₺700) Google yorumu toplamaya yardım eder.",
        "لجلب عملاء أكثر: موقع متوافق مع SEO، ملف كامل على خرائط Google وإعلانات. إعداد الإعلانات ₺2,500 والإدارة من ₺3,500 شهرياً. بطاقات NFC ‏(₺700) تساعد في جمع التقييمات.",
        [L('Grow services', 'Büyüme hizmetleri', 'خدمات النمو', 'Solutions.dc.html')]);
    if (has(['wedding', 'invitation', 'düğün', 'davetiye', 'nikah', 'زفاف', 'دعوة', 'عرس']))
      return R("AuraWeddings creates digital invitations with RSVP, countdown, maps and music — in Turkish, English or Arabic.",
        "AuraWeddings; LCV, geri sayım, harita ve müzikli dijital davetiyeler hazırlar — Türkçe, İngilizce veya Arapça.",
        "AuraWeddings تصمم دعوات رقمية مع تأكيد الحضور والعد التنازلي والخرائط والموسيقى.",
        [L('See AuraWeddings', 'AuraWeddings', 'AuraWeddings', 'https://auradigitalworks.com/aura-weddings')]);
    if (has(['pops', 'link in bio', 'profile', 'profil']))
      return R("AuraPops is your digital profile: links, menu, map, QR and even mini games on one page.",
        "AuraPops dijital profilinizdir: bağlantılar, menü, harita, QR ve mini oyunlar tek sayfada.",
        "AuraPops هو ملفك الرقمي: روابط وقائمة وخريطة وQR وألعاب صغيرة في صفحة واحدة.",
        [L('aurapops.online', 'aurapops.online', 'aurapops.online', 'https://aurapops.online')]);
    if (has(['nfc', 'card', 'kart', 'بطاقة']))
      return R("NFC review cards: customers tap their phone and land on your Google review page. Standard card ₺700, with your branding.",
        "NFC yorum kartları: müşteri telefonu dokundurur, Google yorum sayfanıza ulaşır. Standart kart ₺700, kendi markanızla.",
        "بطاقات NFC: يلمس العميل الهاتف فيصل إلى صفحة تقييمك على Google. البطاقة العادية ₺700 بهويتك.",
        [L('NFC cards', 'NFC kartlar', 'بطاقات NFC', 'Shop.dc.html')]);
    if (has(['how long', 'fast', 'days', 'when', 'ne zaman', 'süre', 'kaç gün', 'hızlı', 'متى', 'مدة', 'كم يوم']))
      return R("Timelines depend on scope and how quickly we receive your content — small sites can launch in days. You'll follow every step in AuraHub.",
        "Süre kapsama ve içeriğin ne kadar hızlı geldiğine bağlıdır — küçük siteler birkaç günde yayına çıkabilir. Her adımı AuraHub'da takip edersiniz.",
        "تعتمد المدة على النطاق وسرعة وصول المحتوى — المواقع الصغيرة قد تُطلق خلال أيام. وتتابع كل خطوة في AuraHub.",
        [L('Start your path', 'Yolculuğa başla', 'ابدأ الآن', 'Hub.dc.html')]);
    if (has(['hub', 'account', 'dashboard', 'track', 'order', 'login', 'hesap', 'sipariş', 'giriş', 'panel', 'حساب', 'طلب', 'لوحة']))
      return R("AuraHub is your workspace: your roadmap, services, requests, payments, deliveries and renewals in one place — with me built in.",
        "AuraHub çalışma alanınızdır: yol haritanız, hizmetler, talepler, ödemeler, teslimatlar ve yenilemeler tek yerde — ben de içindeyim.",
        "AuraHub هي مساحة عملك: خطتك وخدماتك وطلباتك ومدفوعاتك وتسليماتك وتجديداتك في مكان واحد.",
        [L('Open AuraHub', "AuraHub'ı aç", 'افتح AuraHub', 'HubApp.dc.html'), L('Create account', 'Hesap oluştur', 'إنشاء حساب', 'Hub.dc.html')]);
    if (has(['human', 'team', 'person', 'call', 'contact', 'phone', 'talk', 'email', 'mail', 'iletişim', 'ekip', 'telefon', 'فريق', 'اتصال', 'تواصل', 'شخص']))
      return R("Of course. WhatsApp +90 538 550 76 74 or email info@auradigitalworks.com — or send the form on our contact page and it goes straight to the team. (I haven't sent anything for you.)",
        "Tabii. WhatsApp +90 538 550 76 74 veya info@auradigitalworks.com — ya da iletişim sayfasındaki formu gönderin, doğrudan ekibe ulaşır. (Sizin adınıza bir şey göndermedim.)",
        "بالتأكيد. واتساب ‎+90 538 550 76 74 أو البريد info@auradigitalworks.com — أو أرسل النموذج في صفحة التواصل ليصل إلى الفريق مباشرة.",
        [contactLink, L('WhatsApp', 'WhatsApp', 'واتساب', 'https://wa.me/905385507674')]);
    if (has(['logo', 'brand', 'marka', 'kimlik', 'شعار', 'هوية']))
      return R("We design logos and brand identities on request — colors, fonts and visuals that match your business. Tell us what you need for a quote.",
        "Talep üzerine logo ve marka kimliği tasarlıyoruz — işletmenize uygun renkler, yazı tipleri ve görseller. Teklif için ihtiyacınızı yazın.",
        "نصمم الشعارات والهويات عند الطلب — ألوان وخطوط ومرئيات تناسب نشاطك. أخبرنا باحتياجك للحصول على عرض.",
        [contactLink]);
    if (has(['website', 'site', 'web', 'landing', 'store', 'shop', 'mağaza', 'sayfa', 'موقع', 'متجر']))
      return R("We build custom, mobile-first websites: Launch (₺6,750), Growth (₺13,400), System (₺22,400), plus e-commerce or booking sites from ₺26,900. Want me to suggest the right one?",
        "Size özel, mobil uyumlu siteler: Launch (₺6.750), Growth (₺13.400), System (₺22.400), e-ticaret veya randevu siteleri ₺26.900'den. Doğru paketi önermemi ister misiniz?",
        "نبني مواقع مخصصة ومتوافقة مع الجوال: Launch ‏(₺6,750)، Growth ‏(₺13,400)، System ‏(₺22,400)، ومتاجر أو مواقع حجز من ₺26,900.",
        [L('Compare packages', 'Paketleri karşılaştır', 'قارن الباقات', 'Packages.dc.html')]);
    if (has(['language', 'turkish', 'arabic', 'english', 'french', 'dil', 'türkçe', 'arapça', 'لغة', 'عربي']))
      return R("We work in Turkish, English, Arabic and French — websites, menus and customer messages.",
        "Türkçe, İngilizce, Arapça ve Fransızca çalışıyoruz — siteler, menüler ve müşteri mesajları.",
        "نعمل بالتركية والإنجليزية والعربية والفرنسية — المواقع والقوائم ورسائل العملاء.");
    if (/\b(hi|hello|hey|merhaba|selam|salam)\b/i.test(s) || has(['مرحبا', 'السلام', 'اهلا']))
      return R("Hello! Tell me about your business — for example 'I have a café' or 'I want more customers' — and I'll suggest the best first step.",
        "Merhaba! Bana işletmenizden bahsedin — örneğin 'Kafem var' veya 'Daha fazla müşteri istiyorum' — en iyi ilk adımı önereyim.",
        "أهلاً! حدثني عن نشاطك — مثلاً 'عندي مقهى' أو 'أريد عملاء أكثر' — وسأقترح أفضل خطوة أولى.");
    return R("I can help with websites, AuraMenu, WhatsApp automation, Google Maps, ads and AuraHub. The fastest way is a free roadmap — or I can connect you with the team.",
      "Web siteleri, AuraMenu, WhatsApp otomasyonu, Google Haritalar, reklam ve AuraHub konusunda yardımcı olabilirim. En hızlısı ücretsiz yol haritası — ya da sizi ekibe bağlayabilirim.",
      "أستطيع المساعدة في المواقع وAuraMenu وأتمتة واتساب وخرائط Google والإعلانات وAuraHub. الأسرع هو خطة مجانية — أو أوصلك بالفريق.",
      [L('Free roadmap', 'Ücretsiz yol haritası', 'خطة مجانية', 'Hub.dc.html'), contactLink]);
  }
  async askLive(q, l) {
    const post = (path, body, ms) => Promise.race([
      fetch(path, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))
    ]);
    const openSession = async () => { const r = await post('/api/ai/session', {}, 8000); if (!r.ok) throw new Error('session ' + r.status); this.session = true; };
    if (!this.session) await openSession();
    const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'auri-' + Date.now() + '-' + Math.random().toString(16).slice(2, 10);
    const send = () => post('/api/ai/message', { message: q, language: l, page: location.pathname, requestId: id }, 30000);
    let r = await send();
    if (r.status === 401) { this.session = false; await openSession(); r = await send(); }
    else if (r.status === 409) { await new Promise((res) => setTimeout(res, 1500)); r = await send(); }
    if (!r.ok) throw new Error('message ' + r.status);
    const data = await r.json();
    if (!data || typeof data.reply !== 'string' || !data.reply.trim() || data.mode === 'unavailable') throw new Error('unavailable');
    return data.reply;
  }
  async send(text) {
    const q = (text || '').trim().slice(0, 2000);
    if (!q || this.state.typing) return;
    const l = this.detect(q);
    this.setState({ msgs: this.state.msgs.concat([{ role: 'user', text: q }]), draft: '', typing: true, lang: l });
    const local = this.brain(q, l);
    let reply = null;
    if (this.apiAvailable()) {
      try { reply = await this.askLive(q, l); } catch (e) { reply = null; }
    } else {
      await new Promise((res) => { clearTimeout(this.timer); this.timer = setTimeout(res, 600 + Math.min(900, q.length * 12)); });
    }
    this.setState({ typing: false, msgs: this.state.msgs.concat([{ role: 'bot', text: reply || local.text, links: local.links }]) });
  }
  renderVals() {
    const s = this.state;
    const botS = 'align-self: flex-start; max-width: 86%; background: #FFFFFF; border: 1px solid #E6E4DC; border-radius: 16px 16px 16px 4px; padding: 11px 14px; font-size: 14px; line-height: 1.5';
    const userS = 'align-self: flex-end; max-width: 86%; background: #0E2B1E; color: #F3EEDC; border-radius: 16px 16px 4px 16px; padding: 11px 14px; font-size: 14px; line-height: 1.5';
    const chipSets = {
      en: ['I have a restaurant', 'Prices', 'WhatsApp automation', 'How long does it take?', 'Talk to a human'],
      tr: ['Restoranım var', 'Fiyatlar', 'WhatsApp otomasyonu', 'Ne kadar sürer?', 'Ekiple konuşmak istiyorum'],
      ar: ['عندي مطعم', 'الأسعار', 'أتمتة واتساب', 'كم المدة؟', 'أريد التحدث مع شخص']
    };
    return {
      open: s.open,
      chatOpenClass: s.open ? "auri-chat-open" : "",
      showTeaser: !s.open && !s.seen && !s.teaserGone,
      unread: !s.seen,
      fabLabel: s.open ? 'Close Auri chat' : 'Open Auri chat',
      statusText: s.typing ? 'Typing…' : '● Online · EN · TR · العربية',
      studioLabel: ({ en: 'Auri 3D Studio', tr: 'Auri 3D Stüdyo', ar: 'استوديو أوري ثلاثي الأبعاد' })[s.lang] || 'Auri 3D Studio',
      fabRef: (el) => { this.fab = el; },
      toggle: () => this.setState({ open: !s.open, seen: true }),
      reset: () => this.setState({ msgs: [this.greet(s.lang)], typing: false, draft: '' }),
      typing: s.typing,
      draft: s.draft,
      onDraft: (ev) => this.setState({ draft: ev.target.value }),
      submit: (ev) => { ev.preventDefault(); this.send(s.draft); },
      boxRef: (el) => { this.box = el; if (el) setTimeout(() => { el.scrollTop = el.scrollHeight; }, 0); },
      msgs: s.msgs.map((m) => ({ text: m.text, dir: /[؀-ۿ]/.test(m.text.slice(0, 40)) ? 'rtl' : 'ltr', style: m.role === 'bot' ? botS : userS, links: m.links || [], hasLinks: !!(m.links && m.links.length) })),
      chips: chipSets[s.lang].map((c) => ({ label: c, send: () => this.send(c) }))
    };
  }
}
</script>
