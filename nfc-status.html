<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>NFC Kart Talep Durumu — AuraDigital</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="nfc-builder.css" />
    <link rel="stylesheet" href="nfc-status.css" />
  </head>
  <body>
    <header class="builder-header"><a class="builder-brand" href="nfc.html"><img src="logo.svg" alt="" /><span>auradigital</span></a><a class="back-link" href="nfc-builder.html">← NFC Studio</a></header>
    <main class="status-shell">
      <section class="status-card">
        <span class="builder-kicker" id="statusKicker">NFC kart talebi</span>
        <div id="statusSignal" class="status-signal pending"><i></i><span id="statusLabel">Beklemede</span></div>
        <h1 id="statusTitle">Talebiniz inceleniyor.</h1>
        <p id="statusMessage">Tasarımınız AuraDigital paneline ulaştı. Ödeme ve tasarım onayından sonra durum yeşile dönecek.</p>
        <dl id="requestDetails" hidden><div><dt id="businessLabel">İşletme</dt><dd id="businessValue">—</dd></div><div><dt id="typeLabel">Kart türü</dt><dd id="typeValue">—</dd></div><div><dt id="paymentLabel">Ödeme</dt><dd id="paymentValue">—</dd></div><div><dt id="updatedLabel">Son güncelleme</dt><dd id="updatedValue">—</dd></div></dl>
        <div class="status-actions"><button id="refreshButton" class="submit-button" type="button">Durumu yenile</button><a href="nfc-builder.html" id="newRequestLink">Yeni tasarım hazırla</a></div>
        <div id="statusNotice" class="form-notice" role="status"></div>
      </section>
    </main>
    <script src="nfc-status.js"></script>
  </body>
</html>
