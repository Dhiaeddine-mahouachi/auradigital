<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>NFC Kart Talep Durumu — AuraDigital</title>
    <link rel="icon" href="auradigital-mark-20260928.png" type="image/png" />
    <link rel="stylesheet" href="nfc-builder.css" />
    <link rel="stylesheet" href="nfc-status.css" />
  <link rel="stylesheet" href="/ui/design.css?v=20261007"><link rel="stylesheet" href="/ui/products.css?v=20261007"></head>
  <body>
    <header class="builder-header"><a class="builder-brand" href="/nfc"><img src="auradigital-mark-20260928.png" alt="" /><span>auradigital</span></a><a class="back-link" href="/nfc-studio">← NFC Studio</a></header>
    <main class="status-shell">
      <section class="status-card">
        <span class="builder-kicker" id="statusKicker">NFC card request</span>
        <div id="statusSignal" class="status-signal pending"><i></i><span id="statusLabel">Pending</span></div>
        <h1 id="statusTitle">Your request is being reviewed.</h1>
        <p id="statusMessage">Your design reached the AuraDigital dashboard. It turns green after payment and design approval.</p>
        <dl id="requestDetails" hidden><div><dt id="businessLabel">Business</dt><dd id="businessValue">—</dd></div><div><dt id="typeLabel">Card type</dt><dd id="typeValue">—</dd></div><div><dt id="paymentLabel">Payment</dt><dd id="paymentValue">—</dd></div><div><dt id="updatedLabel">Last update</dt><dd id="updatedValue">—</dd></div></dl>
        <div class="status-actions"><button id="refreshButton" class="submit-button" type="button">Refresh status</button><a href="/nfc-studio" id="newRequestLink">Create another design</a></div>
        <div id="statusNotice" class="form-notice" role="status"></div>
      </section>
    </main>
    <script src="nfc-status.js?v=english-first-20261004"></script>
  <script type="module" src="/ui/ecosystem.js?v=20261007"></script></body>
