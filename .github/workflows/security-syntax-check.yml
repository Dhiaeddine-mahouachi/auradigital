name: Security syntax check

on:
  pull_request:
    paths:
      - 'src/**.js'
      - 'src/**/*.js'
      - '.github/workflows/security-syntax-check.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker JavaScript syntax
        run: |
          node --check src/worker.js
          node --check src/secure-worker.js
          node --check src/security-entry.js
          node --check src/worker-entry.js
