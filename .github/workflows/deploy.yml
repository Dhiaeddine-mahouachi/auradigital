name: Deploy

# Tested deploys: nothing reaches Cloudflare unless audit, syntax checks, tests and the
# dry-run build pass first.
#   push to `staging` -> auradigital-staging (workers.dev, staging database)
#   push to `main`    -> production (auradigital.ink, auradigitalworks.com)
#
# One-time setup (see docs/DEPLOYS.md):
#   1. Repo secrets: CLOUDFLARE_API_TOKEN (Workers + D1 edit) and CLOUDFLARE_ACCOUNT_ID.
#   2. Cloudflare dashboard -> auradigital Worker -> Settings -> Builds: disconnect the Git
#      repository, so Cloudflare stops deploying untested commits on its own.
# Until the token secret exists this workflow runs the tests and skips the deploy.

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run check
      - run: npm test
      - run: npm run deploy:check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set: tests passed, deploy skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.creds.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci --ignore-scripts
      - name: Apply database migrations (staging only)
        if: steps.creds.outputs.ready == 'true' && github.ref_name == 'staging'
        continue-on-error: true
        run: npx wrangler d1 migrations apply auradigital-staging-db --remote --env staging
      - name: Deploy to staging
        if: steps.creds.outputs.ready == 'true' && github.ref_name == 'staging'
        run: npx wrangler deploy --env staging
      - name: Deploy to production
        if: steps.creds.outputs.ready == 'true' && github.ref_name == 'main'
        run: npx wrangler deploy
      - name: Smoke test
        if: steps.creds.outputs.ready == 'true' && github.ref_name == 'main'
        run: |
          sleep 20
          code=$(curl -s -o /dev/null -w '%{http_code}' https://auradigital.ink/api/health)
          echo "GET /api/health -> $code"
          if [ "$code" = "404" ]; then
            echo "::notice::/api/health is not deployed yet (it ships with the AuraMenu caching PR). Skipping smoke test."
          elif [ "$code" != "200" ]; then
            echo "::error::Health check failed after deploy. Roll back: npx wrangler rollback (see the Operations Runbook)."
            exit 1
          fi
