name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Production runtime dependencies must be vulnerability-free. Wrangler is a dev-only
      # deployment tool; its current transitive advisory is tracked in SECURITY_AUDIT.md.
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run check
      - run: npm test
      - name: Audit landing image delivery from production (diagnostic)
        continue-on-error: true
        run: LANDING_LIVE_ORIGIN=https://auradigitalworks.com node scripts/check-landing-images.mjs
      - run: npm run deploy:check
      - name: Install Chromium for customer browser checks
        run: npx playwright install --with-deps chromium
      - name: Test luminous public design on eight pages at desktop and mobile widths
        run: |
          python3 -m http.server 4194 --bind 127.0.0.1 > /tmp/aura-luminous-preview.log 2>&1 &
          light_server_pid=$!
          trap 'kill "$light_server_pid" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4194/index.html > /dev/null
          PUBLIC_PALETTE_ORIGIN=http://127.0.0.1:4194 node scripts/test-public-luminous-browser.mjs
      - name: Audit live desktop and mobile landing imagery (diagnostic)
        continue-on-error: true
        run: LANDING_ORIGIN=https://auradigitalworks.com node scripts/test-landing-images-browser.mjs
      - name: Validate landing images with local production assets
        run: |
          python3 -m http.server 4191 --bind 127.0.0.1 > /tmp/auradigital-landing-images.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4191/ > /dev/null
          LANDING_ORIGIN=http://127.0.0.1:4191 node scripts/test-landing-images-browser.mjs
      - name: Test single colorful Before and After comparison at four viewports
        run: |
          python3 -m http.server 4193 --bind 127.0.0.1 > /tmp/aura-comparison-preview.log 2>&1 &
          compare_server_pid=$!
          trap 'kill "$compare_server_pid" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4193/index.html > /dev/null
          COMPARE_TEST_ORIGIN=http://127.0.0.1:4193 node scripts/test-home-comparison-browser.mjs
      - name: Test Portfolio scroll animation and imagery on desktop and mobile
        run: |
          python3 -m http.server 4192 --bind 127.0.0.1 > /tmp/portfolio-preview.log 2>&1 &
          portfolio_server_pid=$!
          trap 'kill "$portfolio_server_pid" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4192/portfolio.html > /dev/null
          PORTFOLIO_TEST_ORIGIN=http://127.0.0.1:4192 node scripts/test-portfolio-browser.mjs
      - name: Verify Emerald Gloss contrast surfaces on representative pages
        run: |
          python3 -m http.server 4195 --bind 127.0.0.1 > /tmp/emerald-theme.log 2>&1 &
          theme_pid=$!
          trap 'kill "$theme_pid" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4195/ > /dev/null
          AURA_THEME_TEST_ORIGIN=http://127.0.0.1:4195 node scripts/test-emerald-gloss-browser.mjs
      - name: Test private draft customer interactions
        run: |
          PORT=5173 node scripts/dev-hub.mjs > /tmp/hub-menu-qa.log 2>&1 &
          sleep 2
          node scripts/test-menu-drafts-browser.mjs
      - name: Test roadmap and shop customer journeys
        run: |
          PORT=4173 node scripts/dev-hub.mjs > /tmp/hub-roadmap-qa.log 2>&1 &
          hub_server_pid=$!
          trap 'kill "$hub_server_pid" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4173/hub > /dev/null
          node scripts/test-hub-browser.mjs
          npm run test:shop:browser
      - name: Preserve private draft UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-menu-draft-screenshots
          path: test-output/menu-drafts-*.png
          if-no-files-found: ignore

      - name: Preserve luminous public design screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-luminous-public-screenshots
          path: test-output/luminous-*.png
          if-no-files-found: ignore

      - name: Preserve Before and After screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-before-after-screenshots
          path: test-output/aura-comparison-*.png
          if-no-files-found: ignore

      - name: Preserve Portfolio screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-portfolio-screenshots
          path: test-output/portfolio-*.png
          if-no-files-found: ignore

      - name: Preserve Aura Command screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-command-screenshots
          path: test-output/aura-command-*.png
          if-no-files-found: ignore
