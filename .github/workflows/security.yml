name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Production runtime dependencies must be vulnerability-free. Wrangler is a dev-only
      # deployment tool; its current transitive advisory is tracked in SECURITY_AUDIT.md.
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run check
      - run: npm test
      - run: npm run deploy:check
