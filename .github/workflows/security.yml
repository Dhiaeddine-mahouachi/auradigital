name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Production runtime dependencies must be vulnerability-free. Wrangler is a dev-only
      # deployment tool; its current transitive advisory is tracked in SECURITY_AUDIT.md.
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run check
      - run: npm test
      - run: npm run deploy:check
      - name: Install Chromium for private draft UI checks
        run: npx playwright install --with-deps chromium
      - name: Test private draft customer interactions
        run: |
          PORT=5173 node scripts/dev-hub.mjs > /tmp/hub-menu-qa.log 2>&1 &
          sleep 2
          node scripts/test-menu-drafts-browser.mjs
      - name: Preserve private draft UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-menu-draft-screenshots
          path: test-output/menu-drafts-*.png
          if-no-files-found: ignore
