<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>AuraDigital Admin</title>
  <style>
    :root{--ink:#101516;--muted:#687272;--line:#dfe5e2;--paper:#f4f7f4;--card:#fff;--accent:#1b9aaa;--dark:#0b1c1f;--dark2:#163438;--ok:#13795b;--danger:#b42318;--warn:#b36b00}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}button,input,textarea,select{font:inherit}.hidden{display:none!important}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#eef3ef,#e1eff0)}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 20px 70px rgba(11,28,31,.12)}.mark{width:42px;height:42px;border-radius:13px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}.mark span{color:#65d3db}.login-card h1{margin:10px 0 8px;font-size:28px;letter-spacing:-.04em}.login-card p{color:var(--muted);line-height:1.6;margin:0 0 22px}.login-card form{display:grid;gap:14px}
    .shell{min-height:100vh;display:grid;grid-template-columns:258px minmax(0,1fr)}aside{background:var(--dark);color:#fff;padding:25px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:20px;font-weight:850;letter-spacing:-.04em}.brand span{color:#65d3db}.admin-label{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#8fb0b4;margin-top:3px}nav{display:grid;gap:4px}.nav-item{border:0;background:transparent;color:#b9c9ca;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer}.nav-item:hover{background:#10292c;color:#fff}.nav-item.active{background:var(--dark2);color:#fff}.aside-foot{margin-top:auto;color:#8fb0b4;font-size:11px;line-height:1.6}
    main{padding:30px clamp(18px,3.5vw,52px);min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.topbar h1{margin:0;font-size:29px;letter-spacing:-.04em}.topbar p{margin:5px 0 0;color:var(--muted)}.top-actions{display:flex;gap:10px;align-items:center}.mobile-nav{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px}
    .btn{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:750}.btn-dark{background:var(--dark);color:#fff}.btn-primary{background:var(--accent);color:#fff}.btn-light{background:#e8eeeb;color:var(--ink)}.btn-danger{background:#fff0ed;color:var(--danger)}.btn-sm{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.55;cursor:not-allowed}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(18,38,39,.035)}.panel+.panel{margin-top:18px}.panel-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.panel h2{margin:0 0 5px;font-size:20px}.panel p{margin:0;color:var(--muted);line-height:1.55}.status{font-size:11px;font-weight:800;border-radius:999px;padding:6px 9px;background:#e9f7f2;color:var(--ok);white-space:nowrap}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.metric span{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:25px;letter-spacing:-.04em;margin-top:6px}.metric.good strong{color:var(--ok)}.metric.warn strong{color:var(--warn)}
    label{display:grid;gap:7px;font-size:12px;font-weight:750}label small{font-weight:400;color:var(--muted)}input,textarea,select{width:100%;border:1px solid #ccd5d1;border-radius:10px;padding:11px 12px;background:#fff;outline:none;color:var(--ink)}textarea{min-height:92px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(27,154,170,.11)}input[type=checkbox]{width:18px;height:18px;box-shadow:none}.check{display:flex;align-items:center;gap:9px;padding-top:7px}
    .pricing-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.pricing-form .wide-actions{grid-column:1/-1;display:flex;align-items:center;gap:12px}.notice{min-height:20px;font-size:12px;color:var(--muted)}.notice.error{color:var(--danger)}.notice.success{color:var(--ok)}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}.data-table{width:100%;border-collapse:collapse;min-width:720px;background:#fff}.data-table th,.data-table td{padding:12px 13px;text-align:left;border-bottom:1px solid #edf0ee;vertical-align:middle}.data-table th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:#f8faf8}.data-table td{font-size:13px}.data-table tr:last-child td{border-bottom:0}.row-actions{display:flex;gap:6px;justify-content:flex-end}.empty{padding:30px;text-align:center;color:var(--muted)}.pill{display:inline-flex;border-radius:999px;padding:5px 8px;background:#eef3f0;color:#40504d;font-size:11px;font-weight:750}.pill.ok{background:#e9f7f2;color:var(--ok)}.pill.warn{background:#fff5e6;color:var(--warn)}
    .request-state{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;text-transform:capitalize}.request-state i{width:9px;height:9px;border-radius:50%;background:#89918e;box-shadow:0 0 0 4px rgba(137,145,142,.12)}.request-state.pending{color:var(--danger)}.request-state.pending i{background:var(--danger);box-shadow:0 0 0 4px rgba(180,35,24,.11)}.request-state.approved{color:var(--ok)}.request-state.approved i{background:var(--ok);box-shadow:0 0 0 4px rgba(19,121,91,.12)}.request-details{display:grid;gap:13px}.request-details dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}.request-details dl div{padding:11px;border:1px solid var(--line);border-radius:10px;background:#f8faf8}.request-details dt{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.request-details dd{margin:4px 0 0;font-size:13px;font-weight:700;overflow-wrap:anywhere}.request-category{padding:12px;border:1px solid var(--line);border-radius:11px}.request-category h3{margin:0 0 8px;font-size:14px}.request-category ul{margin:0;padding-left:18px;color:var(--muted);font-size:12px;line-height:1.7}
    .chart{display:grid;gap:9px}.bar-row{display:grid;grid-template-columns:105px minmax(0,1fr) 55px;gap:10px;align-items:center;font-size:12px}.bar-track{height:10px;border-radius:999px;background:#edf1ef;overflow:hidden}.bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#65d3db)}.analytics-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
    .modal{position:fixed;inset:0;background:rgba(3,15,17,.56);display:grid;place-items:center;padding:18px;z-index:50}.modal-card{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.25)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.modal-head h2{margin:0}.modal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.modal-grid .span-2{grid-column:1/-1}.modal-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:9px;padding-top:6px}
    @media(max-width:1050px){.metrics{grid-template-columns:repeat(2,1fr)}.pricing-form{grid-template-columns:repeat(2,1fr)}.analytics-grid{grid-template-columns:1fr}}
    @media(max-width:820px){.shell{grid-template-columns:1fr}aside{display:none}main{padding:20px 14px}.mobile-nav{display:block}.topbar{align-items:flex-start}.top-actions{flex-direction:column;align-items:flex-end}.metrics,.pricing-form,.modal-grid{grid-template-columns:1fr}.modal-grid .span-2,.pricing-form .wide-actions{grid-column:auto}.bar-row{grid-template-columns:80px minmax(0,1fr) 45px}}
  </style>
  <style>
    .request-category ul{display:grid;gap:8px;padding:0;list-style:none}
    .request-product{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:#f8faf8;line-height:1.35}
    .request-product img,.request-product-placeholder{width:48px;height:48px;flex:0 0 48px;border-radius:9px;object-fit:cover}
    .request-product-placeholder{display:grid;place-items:center;background:#e8eeeb;font-size:20px}
    .request-product div{min-width:0;display:grid;gap:3px}
    .request-product strong{color:var(--ink);font-size:13px}
    .request-product small{color:var(--muted);font-size:11px}
  </style>
</head>
<body>
  <section id="loginView" class="login-wrap">
    <div class="login-card"><div class="mark">A<span>·</span></div><h1>AuraDigital Admin</h1><p>Private control center for your website, clients, sales and recurring business.</p><form id="loginForm"><label>Admin password<input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password"></label><button id="loginBtn" class="btn btn-dark" type="submit">Sign in</button></form><div id="loginNotice" class="notice"></div></div>
  </section>

  <div id="dashboardView" class="shell hidden">
    <aside><div><div class="brand">AURA<span>DIG</span></div><div class="admin-label">Control center</div></div><nav id="sideNav"></nav><div class="aside-foot">AuraDigital Admin v1.0<br>Cloudflare Worker + D1</div></aside>
    <main>
      <div class="topbar"><div><h1 id="pageTitle">Overview</h1><p id="pageSubtitle">Your business at a glance.</p></div><div class="top-actions"><select id="mobileNav" class="mobile-nav" aria-label="Dashboard section"></select><button id="logoutBtn" class="btn btn-light">Log out</button></div></div>
      <div id="content"></div>
    </main>
  </div>

  <div id="modal" class="modal hidden" aria-hidden="true"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Add item</h2><button id="modalClose" class="btn btn-light btn-sm" type="button">Close</button></div><form id="modalForm" class="modal-grid"></form></div></div>

  <script src="/admin/admin.js"></script>
</body>
</html>
