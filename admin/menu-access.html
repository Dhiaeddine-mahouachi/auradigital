<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>AuraDigital — AuraMenu Access</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#07110e;color:#eef8f2}
    .wrap{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:24px}
    .top a{color:#9ee18a;text-decoration:none}.card{background:#0d1c17;border:1px solid #1f3b31;border-radius:18px;padding:18px;margin:12px 0}
    .row{display:grid;grid-template-columns:minmax(220px,1.35fr) minmax(180px,.8fr) minmax(180px,.75fr) minmax(260px,auto);gap:16px;align-items:center}
    .muted{color:#98aaa2;font-size:13px;line-height:1.5}.request-number{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;color:#d9efe4;margin-top:6px}
    .pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#173127;font-size:12px}.requested{background:#5a3712;color:#ffd59a}.active{background:#173d22;color:#b7f5c3}
    .actions{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:8px;align-items:end}.actions label{display:grid;gap:5px;font-size:11px;color:#98aaa2}
    button,select{border:0;border-radius:10px;padding:10px 13px;font:inherit;font-weight:700}.approve{background:#7ec151;color:#09200f;cursor:pointer}.lock{background:#273630;color:#fff;cursor:pointer}
    select{background:#13241e;color:#fff;border:1px solid #2b493e}.price{font-weight:800;color:#b7f5c3;margin-top:5px}.error{padding:16px;background:#481b1b;border-radius:12px}
    @media(max-width:900px){.row{grid-template-columns:1fr 1fr}.actions{grid-column:1/-1}}
    @media(max-width:620px){.row{grid-template-columns:1fr}.actions{grid-column:auto;grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.wrap{padding:18px 12px}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <div class="muted">AURADIGITAL ADMIN</div>
      <h1>AuraMenu editing access</h1>
      <p class="muted">1 gün = 100 TL. Ödemeyi onayladığınız anda sayaç başlar ve süre bittiğinde düzenleme otomatik kilitlenir.</p>
    </div>
    <a href="/admin/">← Main dashboard</a>
  </div>
  <div id="status" class="muted">Loading…</div>
  <div id="list"></div>
</main>
<script src="/admin/menu-access.js" defer></script>
</body>
</html>
