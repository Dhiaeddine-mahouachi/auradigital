<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
html,body{margin:0;background:transparent;width:192px;height:192px;overflow:hidden}
#auri{display:block;position:relative;width:192px;height:192px}
#auri canvas{width:192px;height:192px;display:block}
</style></head><body>
<div id="auri" data-variant="guide" data-phase="idle" level="1"></div>
<script type="module">
import {mountAuri} from '/media/auri/viewer.js';
try {
 const host=document.getElementById('auri');
 window.auriDispose=await mountAuri(host);
 window.auriBakeReady=true;
} catch(error){window.auriBakeError=String(error?.stack||error);}
</script>
</body></html>
