<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AuraDigital · Newsletter studio</title><link rel="stylesheet" href="/style.css"><main style="max-width:850px;margin:auto;padding:24px"><small class="kicker">AURADIGITAL / OWNER WORKSPACE</small><h1 style="font-size:52px">Newsletter studio</h1><label>Preview owner key <input type="password" id="key" autocomplete="off"></label><button id="unlock" class="btn">Unlock studio</button><p id="status" role="status"></p><div id="studio" hidden><h2>Subscriptions</h2><p id="counts"></p><label>Unsubscribe an address<input type="email" id="email"></label><button data-act="remove">Unsubscribe</button><h2>Issues</h2><select aria-label="Newsletter draft" id="issues"></select><label>Subject<input id="subject"></label><label>Email content<textarea rows="6" id="body"></textarea></label><div class="tabs"><button data-act="save">Save draft</button><button data-act="preview">Preview email</button><button id="width">Mobile / desktop</button><button data-act="test">Send mock test</button><button data-act="publish">Publish saved draft to mock inbox</button></div><iframe title="Email preview" sandbox style="width:100%;height:350px" id="frame"></iframe><h2>Delivery status</h2><p id="deliveries"></p><h2>Private mock inbox</h2><div id="inbox"></div></div></main><script>
const $=s=>document.querySelector(s);let list=[];function edit(){const i=list.find(i=>String(i.id)===$('#issues').value);$('#subject').value=i?.subject||'';$('#body').value=i?.body||''}
async function action(a){if(a==='publish'&&!confirm('Publish this saved draft to confirmed preview subscribers?'))return;const id=Number($('#issues').value);try{const r=await fetch('/api/admin/'+a,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+$('#key').value},body:JSON.stringify({id,subject:$('#subject').value,body:$('#body').value,email:$('#email').value})}),d=await r.json();if(!r.ok)throw Error(d.error);$('#studio').hidden=false;$('#status').textContent='Preview studio · '+a+' complete';list=d.issues;$('#issues').replaceChildren(new Option('New draft',''),...list.map(i=>new Option(i.subject+' · '+i.status,i.id)));$('#issues').value=id||((a==='save'&&list[0]?.id)||'');$('#counts').textContent=d.counts.map(c=>c.status+' '+c.n).join(' · ')||'No subscribers';$('#deliveries').textContent=d.deliveries.map(x=>'Issue '+x.issue+' · '+x.status+' '+x.n).join(' | ')||'No publications';$('#frame').srcdoc=d.html;$('#inbox').replaceChildren(...d.inbox.map(m=>{const el=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('p');s.textContent=m.subject+' · '+m.email;p.textContent=m.body;el.append(s,p);const url=m.body.match(/\/\?(confirm|unsubscribe)=[a-f0-9]{64}/);if(url){const link=document.createElement('a');link.href=url[0];link.textContent='Open subscription link';el.append(link)}return el}))}catch(e){$('#status').textContent=e.message}}
$('#unlock').onclick=()=>action('overview');$('#issues').onchange=edit;document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act));$('#width').onclick=()=>$('#frame').style.maxWidth=$('#frame').style.maxWidth?'':'375px';
</script></html>
